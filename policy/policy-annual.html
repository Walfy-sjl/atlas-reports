<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>汽车行业政策库 · 按年度看</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --panel-2:#fafbfc; --ink:#101828; --muted:#475467;
  --faint:#98a2b3; --line:#e4e7ec; --line-soft:#f0f2f5;
  --accent:#0f766e; --accent-ink:#115e59; --accent-soft:#e7f8f5;
  --danger:#b42318; --danger-soft:#fef3f2;
  --warn:#b54708; --warn-soft:#fffaeb;
  --ok:#067647; --ok-soft:#ecfdf3;
  --info:#175cd3; --info-soft:#eff8ff;
  --violet:#7c3aed; --violet-soft:#f4f0ff;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1014; --panel:#151a20; --panel-2:#11161b; --ink:#e8eaed; --muted:#a7b0bd;
    --faint:#6c7683; --line:#29313a; --line-soft:#1d242b;
    --accent:#2dd4bf; --accent-ink:#5eead4; --accent-soft:#0f2e2b;
    --danger:#fda29b; --danger-soft:#3b1219;
    --warn:#fec84b; --warn-soft:#3a2505;
    --ok:#75e0a7; --ok-soft:#0b2e1d;
    --info:#84caff; --info-soft:#0b1f3a;
    --violet:#c4b5fd; --violet-soft:#241a3d;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
.shell{max-width:1240px;margin:0 auto;padding:0 24px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:66px;padding-top:8px;padding-bottom:8px}
.brand .eyebrow{font-size:10px;letter-spacing:.16em;color:var(--faint);font-weight:700;text-transform:uppercase}
.brand h1{margin:1px 0 0;font-size:20px;letter-spacing:-.01em;line-height:1.2}
.proto{display:inline-block;vertical-align:3px;margin-left:5px;font-size:9.5px;font-weight:700;
  letter-spacing:.06em;color:var(--accent-ink);background:var(--accent-soft);padding:1px 6px;border-radius:99px}
.brand .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.mode-switch{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);flex:none}
.mode-switch a,.mode-switch span{padding:6px 9px;font-size:12px;text-decoration:none;color:var(--muted);white-space:nowrap}
.mode-switch a:hover{color:var(--accent-ink);background:var(--panel-2)}
.mode-switch .active{background:var(--accent-soft);color:var(--accent-ink);font-weight:650}
.head-meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.head-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.summary{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 2px 14px;font-size:12.5px;color:var(--muted)}
.summary b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.summary .gap-count{color:var(--danger);font-weight:600}

.layout{display:grid;grid-template-columns:218px minmax(0,1fr);gap:22px;align-items:start;padding:4px 0 60px}
.rail{position:sticky;top:82px}
.rail-title{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin:0 0 8px 2px}
.rail-nav{display:flex;flex-direction:column;gap:2px}
.rail-nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;text-align:left;
  padding:8px 9px;border-radius:9px;color:var(--muted);font-size:13px;line-height:1.35}
.rail-nav button:hover{background:var(--panel);color:var(--ink)}
.rail-nav button[aria-current="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.rail-nav .num{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;width:16px}
.rail-nav .name{flex:1;white-space:nowrap}
.rail-nav .state{font-size:9.5px;color:var(--faint);white-space:nowrap;margin-left:auto}
.rail-note{margin-top:16px;padding:11px 12px;border:1px dashed var(--line);border-radius:10px;
  font-size:11.5px;color:var(--muted);background:var(--panel-2)}
.rail-note b{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}

.module{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px 14px;margin-bottom:18px;scroll-margin-top:92px}
.module-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.kicker{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.module h2{margin:2px 0 2px;font-size:22px;letter-spacing:-.02em}
.module .q{margin:0;font-size:13.5px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);background:var(--panel-2);white-space:nowrap}
.tag.teal{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-ink);background:var(--accent-soft)}
.module-badge{font-size:10.5px;color:var(--faint);white-space:nowrap;padding-top:4px}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
.scroll-hint{font-size:10.5px;color:var(--faint);text-align:right;padding:3px 2px 0}
table.rule{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:820px;table-layout:fixed}
.rule th{background:var(--panel-2);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.03em;
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.rule th:first-child{width:var(--period-w,22%)}   /* 列多时由 JS 收窄期间列，把宽度让给分值列 */
.rule td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55}
.rule tr:last-child td{border-bottom:0}
.rule tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.rule tr.current td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.rule tr.gap td{background:var(--danger-soft)}
.rule tr.pending td{background:var(--warn-soft)}
.rule tr.past td{opacity:.72}
td.period{position:relative;padding-left:28px;white-space:normal}
td.period::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line)}
tr:first-child td.period::before{top:20px}
tr:last-child td.period::before{bottom:calc(100% - 20px)}
td.period::after{content:"";position:absolute;left:5px;top:19px;width:10px;height:10px;border-radius:99px;
  background:var(--faint);border:2px solid var(--panel)}
tr.current td.period::after{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
tr.gap td.period::after{background:var(--danger)}
tr.pending td.period::after{background:var(--warn)}
.period b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.4}
.period b .pfrom,.period b .pto{display:block;white-space:nowrap}
.period .state{display:inline-block;margin-top:3px;font-size:10px;padding:0 6px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);background:var(--panel)}
tr.current .period .state{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft)}
tr.gap .period .state{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line));background:var(--danger-soft)}
tr.pending .period .state{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));background:var(--warn-soft)}
.fn{font-size:9px;color:var(--accent-ink);margin-left:3px;vertical-align:super}
.notes{padding:8px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.55}
.notes .fn-row{display:grid;grid-template-columns:16px minmax(0,1fr);gap:4px;margin-top:2px}
.notes .fn-row b{color:var(--accent-ink);font-weight:700}
.val{display:block}
.val b{font-weight:650}
.val .sub{display:block;font-size:11px;color:var(--faint);margin-top:2px;line-height:1.4}
td.value.empty{color:var(--faint)}
.src{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 2px 0;font-size:11px;color:var(--faint)}
.src a{color:var(--muted);text-decoration:none}
.src a:hover{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.src-lib{font-size:10px;color:var(--accent-ink);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.src-lib:hover{background:var(--accent-soft)}
.src .pending-chip{font-size:9.5px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));
  background:var(--warn-soft);padding:0 5px;border-radius:99px}

.empty-state{padding:18px;font-size:13px;color:var(--muted);text-align:center}
footer{color:var(--faint);font-size:12px;border-top:1px solid var(--line);padding:16px 0 30px}
footer .shell{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:1100px){
  header.top{position:static}
  .layout{grid-template-columns:1fr;gap:10px}
  /* min-width:0 是键：网格项的默认 min-width 是 auto，横向不换行的导航会把整页撑开 */
  .layout > *{min-width:0}
  .rail{min-width:0;max-width:100%;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 8px;margin:0 -24px;
    padding-left:24px;padding-right:24px;border-bottom:1px solid var(--line)}
  #modules{min-width:0}
  .rail-title,.rail-note{display:none}
  .rail-nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;min-width:0;max-width:100%}
  .rail-nav::-webkit-scrollbar{display:none}
  .rail-nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:6px 10px}
  .rail-nav .num{display:none}
  .rail-nav .state{display:none}
  .module{scroll-margin-top:120px}
}
@media (max-width:720px){
  .shell{padding:0 14px}
  .head{flex-wrap:wrap;gap:8px}
  .head-meta{width:100%;justify-content:flex-start;flex-wrap:wrap;white-space:normal}
  .module{padding:14px}
  .module h2{font-size:19px}
  .rule{min-width:680px}
  table.rule th:first-child{width:23%}
}
@media print{
  header.top,.rail,.summary{display:none!important}
  .layout{display:block}
  .module{box-shadow:none;break-inside:avoid}
  .table-wrap{overflow:visible}
  table.rule{min-width:0}
}
</style>
</head>

</footer>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stateClass = s => s === "现行" ? "current" : s === "空窗" ? "gap" : s === "待生效" || s === "待定" ? "pending" : "past";

function renderSummary(){
  const s = DATA.stats;
  $("#summary").innerHTML = `
    <span><b>${s.modules}</b> 个模块</span>
    <span><b>${s.periods}</b> 个时间段</span>
    <span class="${s.gaps ? "gap-count" : ""}"><b>${s.gaps}</b> 个空窗</span>
    <span><b>${s.pending}</b> 个待生效 / 待定</span>
    <span style="margin-left:auto">滚动看模块；点模块名跳转</span>`;
}

function renderRail(){
  $("#rail").innerHTML = DATA.modules.map(m => {
    const cur = m.periods.find(r => r.current);
    const state = cur ? "现行" : (m.periods.some(r => r.status === "空窗") ? "有空窗" : "");
    return `<button data-goto="${esc(m.id)}" aria-current="false" title="${esc(cur ? cur.period : "")}">
      <span class="num">${esc(m.index)}</span>
      <span class="name">${esc(m.name)}</span>
      <span class="state">${esc(state)}</span>
    </button>`;
  }).join("");
}

function renderModules(){
  $("#modules").innerHTML = DATA.modules.map(m => {
    const head = `<div class="module-head">
      <div>
        <div class="kicker">模块 ${esc(m.index)} · ${esc(m.bucket)}</div>
        <h2>${esc(m.name)}</h2>
        <p class="q">${esc(m.question)}</p>
        <div class="tags">${m.applies.map((x,i) => `<span class="tag ${i === 0 ? "teal" : ""}">${esc(x)}</span>`).join("")}</div>
      </div>
      <div class="module-badge">${m.periods.length} 个时间段</div>
    </div>`;

    const noteNo = {}; let nn = 0;
    m.periods.forEach((r, i) => { if (r.note) noteNo[i] = ++nn; });
    // 列多了要给足宽度，否则公式（如 0.0017R+0.15（≤1.2））会被挤成两三行；
    // 超出容器时表格自带横向滚动（.table-wrap + 底部「横向滚动」提示）。
    const nCol = m.columns.length;
    const minW = nCol >= 8 ? 900 : nCol >= 6 ? 980 : nCol === 5 ? 860 : nCol === 4 ? 760 : 620;
    const table = `<div class="table-wrap"><table class="rule" style="min-width:${minW}px;--period-w:${nCol >= 8 ? 15 : 22}%">
      <thead><tr><th scope="col">期间</th>${m.columns.map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${m.periods.map((r, i) => {
        const cls = [stateClass(r.status), r.current ? "current" : ""].filter(Boolean).join(" ");
        return `<tr class="${cls}">
          <td class="period">
            ${periodHtml(r.period)}
            <span class="state">${esc(r.status)}</span>
            ${r.note ? `<sup class="fn" title="${esc(r.note)}">${noteNo[i]}</sup>` : ""}
          </td>
          ${r.values.map((v,i) => `<td class="value ${v === "—" || v === "?" || v === "待定" ? "empty" : ""}">${fmtVal(v)}</td>`).join("")}
        </tr>`;
      }).join("")}</tbody>
    </table></div>`;

    const notes = m.periods.map((r,i) => r.note ? `<div class="fn-row"><b>${noteNo[i]}</b><span>${esc(r.note)}</span></div>` : "").join("");
    const notesHtml = notes ? `<div class="notes">${notes}</div>` : "";

    const sources = [...new Set(m.periods.flatMap(r => r.sources.map(s => JSON.stringify(s))))]
      .map(s => JSON.parse(s));
    const src = sources.length ? `<div class="src">来源：${sources.map(s => {
      const label = esc(s.label);
      const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${label} ↗</a>` : label;
      const lib = s.in_library && s.id
        ? ` <a class="src-lib" href="policy-buckets.html#card-${esc(s.id)}" target="_blank" rel="noopener">库</a>`
        : "";
      return link + lib + (s.in_library ? "" : ` <span class="pending-chip">待补</span>`);
    }).join(" · ")}</div>` : "";

    return `<section class="module" id="m-${esc(m.id)}">${head}${table}${notesHtml}${src}</section>`;
  }).join("");
}

function periodHtml(p){
  const parts = String(p).split(" ~ ");
  if (parts.length === 2){
    return `<b><span class="pfrom">${esc(parts[0])}</span><span class="pto">~ ${esc(parts[1])}</span></b>`;
  }
  return `<b>${esc(p)}</b>`;
}

function fmtVal(v){
  const s = String(v ?? "—");
  // 把「A + B」这类长值拆成主值 + 小字注释，避免一格全是粗体
  const idx = s.indexOf(" + ");
  if (idx > 0 && s.length > 28){
    return `<span class="val"><b>${esc(s.slice(0, idx))}</b><span class="sub">${esc(s.slice(idx + 3))}</span></span>`;
  }
  return `<span class="val">${esc(s)}</span>`;
}

function setupNav(){
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-goto]");
    if (!b) return;
    const el = document.getElementById("m-" + b.dataset.goto);
    if (el) el.scrollIntoView({block:"start", behavior:"smooth"});
  });
  const btn = id => document.querySelector(`[data-goto="${id}"]`);
  const obs = new IntersectionObserver(entries => {
    for (const en of entries){
      if (!en.isIntersecting) continue;
      const id = en.target.id.replace("m-", "");
      $$("#rail button").forEach(b => b.setAttribute("aria-current", String(b.dataset.goto === id)));
    }
  }, {rootMargin:"-90px 0px -65% 0px", threshold:0});
  $$(".module").forEach(m => obs.observe(m));
}

renderSummary();
renderRail();
renderModules();
setupNav();
document.querySelectorAll(".table-wrap").forEach(w => {
  if (w.scrollWidth > w.clientWidth + 2){
    const h = document.createElement("div");
    h.className = "scroll-hint";
    h.textContent = "← 横向滚动看全部列 →";
    w.after(h);
  }
});
</script>
</body>
</html>
